[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsx"
version = "0.2.1"
description = "A PyTorch-based scaling and merging library for serial crystallography"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hans Peter Seidel" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # Brings torch, triton and gemmi. TorchRef's minor releases change its API,
    # so the bound follows the minor version torchsx is tested against.
    "torchref>=0.7.0,<0.8",
    # The compiled fold encoder is version-sensitive: torch 2.13's inductor fails
    # on its backward pass (CantSplit) and 2.11 fails too. Pinned to 2.9, the
    # minor version it is known to train with.
    "torch==2.9.*",
    "numpy>=2",          # the Python writer's float32 arithmetic (NEP 50)
    "safetensors>=0.4",  # the .sfx working format
    "matplotlib>=3.7",   # the figures of torchsx.observation-stats and torchsx.merge-stats
    "duckdb>=1.0",       # probixi's DuckDB runs (SFXStream.from_duckdb)
    # The .stream reader/writer (Rust), built from native/ in this repository and
    # released with torchsx. The pin follows native/Cargo.toml's minor version;
    # bump both (and PROTOCOL) when the Rust↔Python interface changes.
    "torchsx-native==0.1.*",
]

[project.urls]
Repository = "https://github.com/HatPdotS/TorchSX"

[project.scripts]
"torchsx.train" = "torchsx.cli.train:main"
"torchsx.merge" = "torchsx.cli.merge_nn:main"
"torchsx.observation-stats" = "torchsx.cli.stats:main"
"torchsx.merge-stats" = "torchsx.cli.merge_stats:main"

[project.optional-dependencies]
dev = ["pytest>=6.0", "black>=21.5", "isort>=5.9"]

[tool.setuptools.packages.find]
include = ["torchsx*"]
