[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsx"
version = "0.1.0"
description = "GPU-friendly stacked tensors for unmerged serial crystallography data"
requires-python = ">=3.10"
dependencies = [
    "torchref>=0.6.4",   # brings torch, triton and gemmi
    "numpy>=1.24",
    "safetensors>=0.4",  # the .sfx working format
]

[project.optional-dependencies]
# Read probixi's DuckDB runs (SFXStream.from_duckdb).
duckdb = ["duckdb>=1.0"]
# Pixel-patch extraction from HDF5 frames (SFXStream.excise_patches / excise_rois).
patches = ["h5py>=3.8", "bitshuffle>=0.5"]
# scipy.stats.poisson, for merging/gating's background-significance split.
gating = ["scipy>=1.10"]
# Building the native .stream parser extension (io/_native.py JIT-compiles it).
native = ["ninja>=1.11"]

dev = ["pytest>=6.0", "black>=21.5", "isort>=5.9"]

[tool.setuptools.packages.find]
include = ["torchsx*"]
