[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "torchsx-native"
# The version is Cargo.toml's (maturin fills it in).
dynamic = ["version"]
description = "Native CrystFEL .stream reader/writer for torchsx"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hans Peter Seidel" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2"]

[project.urls]
Repository = "https://github.com/HatPdotS/torchsx"

[tool.maturin]
module-name = "torchsx_native"
